<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Jamaah MZPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins','Segoe UI',Tahoma,sans-serif;background:#f0f4f8;color:#1e293b;padding:14px;font-size:14px}
  .container{max-width:800px;margin:0 auto}
  
  header{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:18px 22px;border-radius:12px;margin-bottom:14px;box-shadow:0 4px 12px rgba(15,118,110,.3);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  .header-left{display:flex;align-items:center;gap:14px}
  .logo-img{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#fff;padding:4px}
  
  header h1{font-size:20px;font-weight:600}
  header p{font-size:12px;opacity:.9;margin-top:3px;font-weight:300}
  
  .btn{padding:9px 15px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;transition:.15s;white-space:nowrap;font-family:'Poppins',sans-serif}
  .btn:hover{opacity:.88;transform:translateY(-1px)}
  .btn-primary{background:#0f766e;color:#fff}
  .btn-success{background:#16a34a;color:#fff}
  .btn-danger{background:#dc2626;color:#fff}
  .btn-warning{background:#d97706;color:#fff}
  .btn-secondary{background:#64748b;color:#fff}
  .btn-sm{padding:5px 9px;font-size:12px;border-radius:6px}
  
  .stats{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .stat-card{background:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);flex:1;min-width:100px}
  .stat-card .label{font-size:11px;color:#64748b}
  .stat-card .value{font-size:20px;font-weight:700;color:#0f766e}
  
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center;background:#fff;padding:10px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .toolbar input,.toolbar select{padding:8px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;background:#fff;font-family:'Poppins',sans-serif}
  .toolbar input[type=text]{flex:1;min-width:150px}
  
  .list-wrap{display:flex;flex-direction:column;gap:8px}
  .name-card{background:#fff;padding:14px 18px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;transition:.15s;display:flex;justify-content:space-between;align-items:center;border-left:4px solid #14b8a6}
  .name-card:hover{transform:translateX(4px);box-shadow:0 3px 8px rgba(15,118,110,.15)}
  .name-card .name{font-size:15px;font-weight:600;color:#0f172a;display:flex;align-items:center;gap:8px}
  .name-card .sub{font-size:12px;color:#64748b;margin-top:2px;font-weight:300}
  .name-card .arrow{color:#cbd5e1;font-size:18px}
  .empty{text-align:center;padding:40px;color:#94a3b8;background:#fff;border-radius:12px}
  
  .badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;letter-spacing:.5px}
  .badge-aktif{background:#dcfce7;color:#166534}
  .badge-nonaktif{background:#fee2e2;color:#991b1b}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;align-items:center;justify-content:center;padding:14px}
  .modal-overlay.active{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:750px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 40px rgba(0,0,0,.3);display:flex;flex-direction:column}
  .modal-header{padding:18px 24px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px 14px 0 0;position:sticky;top:0;z-index:1}
  .modal-header h2{font-size:18px;color:#0f766e;font-weight:600}
  .close-btn{background:none;border:none;font-size:28px;cursor:pointer;color:#64748b;line-height:1;padding:0 5px}
  
  .modal-body{padding:20px 24px}
  .detail-grid{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;font-size:13.5px}
  .detail-label{color:#64748b;font-weight:500}
  .detail-value{color:#1e293b;font-weight:400}
  .detail-value.empty-val{color:#cbd5e1;font-style:italic}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-group{display:flex;flex-direction:column;gap:3px}
  .form-group.full{grid-column:1/-1}
  .form-group label{font-size:12px;font-weight:500;color:#475569}
  .form-group input,.form-group select{padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;font-family:'Poppins',sans-serif}
  .form-group input:focus,.form-group select:focus{outline:2px solid #14b8a6;border-color:transparent}
  
  .modal-footer{padding:16px 24px;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;background:#f8fafc;border-radius:0 0 14px 14px;position:sticky;bottom:0;z-index:1}
  .footer-right{display:flex;gap:8px}
  
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:#0f172a;color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;z-index:200;transition:.3s;opacity:0;box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  
  @media(max-width:640px){
    .form-grid{grid-template-columns:1fr}
    .detail-grid{grid-template-columns:1fr;gap:4px}
    .detail-label{margin-top:8px}
    .modal-footer{flex-direction:column-reverse;gap:12px;align-items:stretch}
    .footer-right{justify-content:space-between}
    .toolbar{flex-direction:column;align-items:stretch}
    .toolbar input[type=text]{min-width:100%}
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-left">
      <!-- LOGO ANDA -->
      <img src="https://raw.githubusercontent.com/suanor513/Data-Jamaah-MZPC/main/MZPC%20ssuai%20kode.png" alt="Logo MZPC" class="logo-img" onerror="this.style.display='none'">
      <div>
        <h1>📖 Data Jamaah MZPC</h1>
        <p>Klik nama jamaah untuk melihat biodata lengkap</p>
      </div>
    </div>
    <button class="btn btn-success" onclick="openForm()">+ Tambah Jamaah</button>
  </header>

  <div class="stats">
    <div class="stat-card"><div class="label">Total Jamaah</div><div class="value" id="statTotal">0</div></div>
    <div class="stat-card"><div class="label">Aktif</div><div class="value" id="statAktif" style="color:#16a34a">0</div></div>
    <div class="stat-card"><div class="label">Non Aktif</div><div class="value" id="statNonAktif" style="color:#dc2626">0</div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 Cari nama...">
    <select id="filterAmalan"><option value="">Semua Amalan Kaji</option></select>
    <select id="filterStatus">
      <option value="">Semua Status</option>
      <option value="Aktif">Hanya Aktif</option>
      <option value="Non Aktif">Hanya Non Aktif</option>
    </select>
    <button class="btn btn-warning" onclick="exportCSV()">⬇ Ekspor CSV</button>
  </div>

  <div class="list-wrap" id="listContainer">
    <div class="empty" id="loadingText">Memuat data dari server...</div>
  </div>
</div>

<!-- Modal Detail & Edit -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Detail Jamaah</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    
    <div class="modal-body" id="viewMode">
      <div class="detail-grid" id="detailContent"></div>
    </div>
    
    <div class="modal-body" id="editMode" style="display:none">
      <form id="jamaahForm" onsubmit="saveData(event)">
        <input type="hidden" id="editIndex">
        <div class="form-grid">
          <div class="form-group"><label>Nama *</label><input type="text" id="f_nama" required></div>
          
          <div class="form-group">
            <label>Status *</label>
            <select id="f_status" required>
              <option value="Aktif">Aktif</option>
              <option value="Non Aktif">Non Aktif</option>
            </select>
          </div>

          <div class="form-group"><label>Tempat Tgl Lahir</label><input type="text" id="f_ttl"></div>
          <div class="form-group full"><label>Alamat</label><input type="text" id="f_alamat"></div>
          <div class="form-group"><label>No. HP/WA</label><input type="text" id="f_hp"></div>
          <div class="form-group"><label>No. Telp Keluarga</label><input type="text" id="f_telp"></div>
          <div class="form-group"><label>Pekerjaan</label><input type="text" id="f_pekerjaan"></div>
          <div class="form-group"><label>Pendidikan Terakhir</label><input type="text" id="f_pendidikan"></div>
          <div class="form-group"><label>Nama Suami/Istri</label><input type="text" id="f_pasangan"></div>
          <div class="form-group"><label>Nama Ayah</label><input type="text" id="f_ayah"></div>
          <div class="form-group"><label>Nama Ibu</label><input type="text" id="f_ibu"></div>
          <div class="form-group"><label>Tgl/bln/thn Masuk TN</label><input type="text" id="f_masuk"></div>
          <div class="form-group"><label>Tgl/bln/thn Suluk Terakhir</label><input type="text" id="f_suluk"></div>
          <div class="form-group"><label>Suluk ke</label><input type="text" id="f_sulukke"></div>
          <div class="form-group"><label>Amalan Kaji</label><input type="text" id="f_amalan"></div>
          <div class="form-group"><label>Riwayat Sakit</label><input type="text" id="f_sakit"></div>
          <div class="form-group"><label>Amalan Kebathinan Sebelum</label><input type="text" id="f_amalansebelum"></div>
          <div class="form-group"><label>Amalan Kebathinan Sejak</label><input type="text" id="f_amalansejak"></div>
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <div id="deleteWrapper"></div>
      <div class="footer-right" id="footerButtons"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== KONFIGURASI JSONBIN ===== */
const JSONBIN_BIN_ID = '6ad76bfaac6210605a42509e';
// PASTE MASTER KEY ANDA DI BAWAH INI (GANTI TEKS DI DALAM KUTIP)
const JSONBIN_API_KEY = '$2a$10$Mpqt49q5pQBIfDnCU2cVJ.BI1Dq2tLJFc2cWqDImU8y9jLamRVfhC'; 
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

let data=[],filteredData=[],currentIndex=-1;

/* ===== FUNGSI LOAD DATA DARI SERVER ===== */
async function loadDataFromServer() {
  try {
    const response = await fetch(`${JSONBIN_URL}/latest`, {
      method: 'GET',
      headers: {
        'X-Master-Key': JSONBIN_API_KEY
      }
    });
    
    if (!response.ok) throw new Error('Gagal mengambil data');
    
    const result = await response.json();
    // Karena di JSONBin kita simpan sebagai {"jamaah": [...]}, kita ambil array-nya
    // Jika masih kosong, fallback ke array kosong
    data = (result.record && result.record.jamaah) ? result.record.jamaah : [];
    
    if (data.length === 0) {
      // Jika database kosong, kita bisa isi dengan data awal (opsional)
      // Untuk sementara kita biarkan kosong agar Anda bisa input dari awal.
    }
    
    render();
  } catch (error) {
    console.error("Error:", error);
    document.getElementById('listContainer').innerHTML = '<div class="empty" style="color:#dc2626">Gagal memuat data. Periksa koneksi internet atau API Key Anda.</div>';
  }
}

/* ===== FUNGSI SIMPAN KE SERVER ===== */
async function saveDataToServer(newDataArray) {
  try {
    const response = await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_API_KEY
      },
      body: JSON.stringify({ "jamaah": newDataArray })
    });
    
    if (!response.ok) {
       const errBody = await response.text();
       console.error("Server Error:", errBody);
       throw new Error('Gagal menyimpan data ke server');
    }
    
    // Simpan ke cache lokal setelah berhasil simpan ke server
    localStorage.setItem('mzpc_cache', JSON.stringify(newDataArray));
    
    return true;
  } catch (error) {
    console.error("Error:", error);
    alert("⚠️ GAGAL MENYIMPAN KE SERVER!\n\nPastikan API Key sudah benar dan koneksi internet stabil.");
    return false;
  }
}

function esc(s){ return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render(){
  if(!data) return;
  
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  const fA=document.getElementById('filterAmalan').value;
  const fS=document.getElementById('filterStatus').value;

  filteredData=data.filter(d=>{
    const okQ=!q||Object.values(d).some(v=>String(v||'').toLowerCase().includes(q));
    const okA=!fA||d.amalan===fA;
    const okS=!fS||d.status===fS;
    return okQ&&okA&&okS;
  });

  const container=document.getElementById('listContainer');
  if(!filteredData.length){
    container.innerHTML='<div class="empty">Belum ada data. Klik "+ Tambah Jamaah" untuk mulai.</div>';
  }else{
    container.innerHTML=filteredData.map(d=>{
      const i=data.indexOf(d);
      const info = [d.pekerjaan, d.alamat].filter(x=>x && x!=='-').join(' • ');
      const badgeClass = d.status === 'Aktif' ? 'badge-aktif' : 'badge-nonaktif';
      
      return `<div class="name-card" onclick="openDetail(${i})">
        <div>
          <div class="name">
            ${esc(d.nama)} 
            <span class="badge ${badgeClass}">${esc(d.status || 'Aktif')}</span>
          </div>
          <div class="sub">${esc(info) || '-'}</div>
        </div>
        <div class="arrow">›</div>
      </div>`;
    }).join('');
  }

  document.getElementById('statTotal').textContent=data.length;
  
  const jmlAktif = data.filter(d => d.status === 'Aktif' || !d.status).length;
  const jmlNon = data.length - jmlAktif;
  
  document.getElementById('statAktif').textContent=jmlAktif;
  document.getElementById('statNonAktif').textContent=jmlNon;

  updateFilters();
}

function updateFilters(){
  const aSel=document.getElementById('filterAmalan');
  const ca=aSel.value;
  const aSet=[...new Set(data.map(d=>d.amalan).filter(Boolean))].sort();
  aSel.innerHTML='<option value="">Semua Amalan Kaji</option>'+aSet.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
  if(aSet.includes(ca))aSel.value=ca;
}

const LABELS = {
  status: 'Status',
  ttl:'Tempat, Tgl Lahir', alamat:'Alamat', hp:'No. HP/WA', telp:'Telp Keluarga',
  pekerjaan:'Pekerjaan', pendidikan:'Pendidikan', pasangan:'Suami/Istri',
  ayah:'Nama Ayah', ibu:'Nama Ibu', masuk:'Masuk TN', suluk:'Suluk Terakhir',
  sulukke:'Suluk ke', amalan:'Amalan Kaji', sakit:'Riwayat Sakit',
  amalansebelum:'Amalan Sebelum', amalansejak:'Amalan Sejak'
};

function openDetail(idx){
  currentIndex=idx;
  const d=data[idx];
  
  document.getElementById('modalTitle').textContent = d.nama;
  document.getElementById('viewMode').style.display='block';
  document.getElementById('editMode').style.display='none';
  
  let html='';
  for(const key in LABELS){
    let val = d[key] || '-';
    let cls = (val==='-' || val==='') ? 'empty-val' : '';
    
    if(key === 'status'){
      if(val === 'Aktif') val = '<span style="color:#16a34a;font-weight:600">Aktif</span>';
      else if(val === 'Non Aktif') val = '<span style="color:#dc2626;font-weight:600">Non Aktif</span>';
      cls = ''; 
    } else {
      if(val==='') val='-';
      val = esc(val);
    }
    
    html += `<div class="detail-label">${LABELS[key]}</div>
             <div class="detail-value ${cls}">${val}</div>`;
  }
  document.getElementById('detailContent').innerHTML = html;
  
  document.getElementById('deleteWrapper').innerHTML = 
    `<button class="btn btn-danger" onclick="deleteData(${idx})">🗑️ Hapus</button>`;
  document.getElementById('footerButtons').innerHTML = 
    `<button class="btn btn-secondary" onclick="closeModal()">Tutup</button>
     <button class="btn btn-warning" onclick="switchToEdit()">✏️ Edit Data</button>`;
     
  document.getElementById('modalOverlay').classList.add('active');
}

const FIELDS=['nama','status','ttl','alamat','hp','telp','pekerjaan','pendidikan','pasangan','ayah','ibu','masuk','suluk','sulukke','amalan','sakit','amalansebelum','amalansejak'];

function switchToEdit(){
  const idx=currentIndex;
  document.getElementById('modalTitle').textContent = 'Edit Jamaah';
  document.getElementById('viewMode').style.display='none';
  document.getElementById('editMode').style.display='block';
  
  document.getElementById('editIndex').value=idx;
  FIELDS.forEach(f=>document.getElementById('f_'+f).value=idx!==undefined?(data[idx][f]||''):'');
  
  document.getElementById('deleteWrapper').innerHTML = '';
  document.getElementById('footerButtons').innerHTML = 
    `<button class="btn btn-secondary" onclick="cancelEdit()">Batal</button>
     <button class="btn btn-primary" onclick="document.getElementById('jamaahForm').requestSubmit()">💾 Simpan Perubahan</button>`;
     
  setTimeout(()=>document.getElementById('f_nama').focus(),50);
}

function openForm(){
  currentIndex=-1; 
  
  document.getElementById('modalTitle').textContent = 'Tambah Jamaah Baru';
  document.getElementById('viewMode').style.display='none';
  document.getElementById('editMode').style.display='block';
  
  document.getElementById('editIndex').value='';
  FIELDS.forEach(f=>document.getElementById('f_'+f).value='');
  document.getElementById('f_status').value='Aktif'; 
  
  document.getElementById('deleteWrapper').innerHTML = '';
  document.getElementById('footerButtons').innerHTML = 
    `<button class="btn btn-secondary" onclick="closeModal()">Batal</button>
     <button class="btn btn-primary" onclick="document.getElementById('jamaahForm').requestSubmit()">💾 Simpan Baru</button>`;
  
  document.getElementById('modalOverlay').classList.add('active');
  setTimeout(()=>document.getElementById('f_nama').focus(),50);
}

function cancelEdit(){
  if(currentIndex===-1) closeModal();
  else openDetail(currentIndex);
}

async function saveData(e){
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]') || document.querySelector('.btn-primary');
  const originalText = btn.innerHTML;
  btn.innerHTML = 'Menyimpan...';
  btn.disabled = true;

  const idx=document.getElementById('editIndex').value;
  const obj={}; 
  FIELDS.forEach(f=>obj[f]=document.getElementById('f_'+f).value.trim());
  
  let newDataArray = JSON.parse(JSON.stringify(data));

  if(idx===''){
    newDataArray.push(obj);
    if (await saveDataToServer(newDataArray)) {
      data = newDataArray;
      showToast('✅ Jamaah baru berhasil disimpan ke server');
      closeModal();
      render();
    }
  } else {
    newDataArray[parseInt(idx)] = obj;
    if (await saveDataToServer(newDataArray)) {
      data = newDataArray;
      showToast('✅ Perubahan berhasil disimpan ke server');
      currentIndex = parseInt(idx);
      openDetail(currentIndex);
      render();
    }
  }
  
  btn.innerHTML = originalText;
  btn.disabled = false;
}

async function deleteData(i){
  if(!confirm(`Hapus data "${data[i].nama}" secara permanen?`))return;
  let newDataArray = JSON.parse(JSON.stringify(data));
  newDataArray.splice(i,1); 
  
  if (await saveDataToServer(newDataArray)) {
    data = newDataArray;
    showToast('🗑️ Data dihapus dari server');
    closeModal(); 
    render(); 
  }
}

function closeModal(){ 
  document.getElementById('modalOverlay').classList.remove('active'); 
  currentIndex=-1;
}

function exportCSV(){
  const H=['No.','Nama','Status','Tempat Tgl Lahir','Alamat','No. HP/Wa','No. Telp Keluarga','Pekerjaan','Pendidikan Terakhir','Nama Suami/Istri','Nama Ayah','Nama Ibu','Tgl/bln/thn masuk TN','tgl/bln/thn Suluk Terakhir','Suluk ke','Amalan Kaji','Pernah Menderita Sakit','Amalan Kebathinan Sebelum','Amalan Kebathinan Sejak'];
  const R=data.map((d,i)=>[i+1,d.nama,d.status,d.ttl,d.alamat,d.hp,d.telp,d.pekerjaan,d.pendidikan,d.pasangan,d.ayah,d.ibu,d.masuk,d.suluk,d.sulukke,d.amalan,d.sakit,d.amalansebelum,d.amalansejak]);
  const csv=[H,...R].map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`Data_Jamaah_MZPC_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href); showToast('⬇ CSV diunduh');
}

let toastTimer;
function showToast(m){
  const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}

document.getElementById('searchInput').addEventListener('input',render);
document.getElementById('filterAmalan').addEventListener('change',render);
document.getElementById('filterStatus').addEventListener('change',render);
document.getElementById('modalOverlay').addEventListener('click',e=>{ if(e.target.id==='modalOverlay')closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });

/* ===== FUNGSI LOAD DATA DARI SERVER (DENGAN CACHE) ===== */
async function loadDataFromServer() {
  // 1. Tampilkan data dari cache lokal (jika ada) agar layar langsung terisi
  const cache = localStorage.getItem('mzpc_cache');
  if (cache) {
    try {
      data = JSON.parse(cache);
      render();
    } catch(e) {}
  } else {
    // Jika belum ada cache sama sekali, tampilkan teks loading
    document.getElementById('listContainer').innerHTML = '<div class="empty">Memuat data dari server (mohon tunggu)...</div>';
  }

  // 2. Ambil data terbaru dari server di latar belakang
  try {
    const response = await fetch(`${JSONBIN_URL}/latest`, {
      method: 'GET',
      headers: {
        'X-Master-Key': JSONBIN_API_KEY
      }
    });
    
    if (!response.ok) throw new Error('Gagal mengambil data');
    
    const result = await response.json();
    let dataDariServer = [];
    
    if (result.record) {
       if (Array.isArray(result.record)) {
           dataDariServer = result.record;
       } else if (result.record.jamaah && Array.isArray(result.record.jamaah)) {
           dataDariServer = result.record.jamaah;
       }
    }
    
    data = dataDariServer;
    
    // Simpan data terbaru ke cache lokal
    localStorage.setItem('mzpc_cache', JSON.stringify(data));
    
    render();
    
  } catch (error) {
    console.error("Error:", error);
    // Jika gagal mengambil data dari server, tapi kita punya cache, biarkan layar menampilkan cache.
    if (!cache) {
       document.getElementById('listContainer').innerHTML = '<div class="empty" style="color:#dc2626">Gagal memuat data. Periksa koneksi internet atau API Key Anda.</div>';
    }
  }
}
